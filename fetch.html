<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We</title>
    <style>
        
        table{
            width: 80%;
            margin: auto;
            font-size: 25px;
            color: black;
            border: 2px solid black; 
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>Day</th>
                <th>Time</th>
                <th>City</th>
                <th>Weather</th>

            </tr>
        </thead>
        <tbody id="data">

        </tbody>
    </table>
    <script>
        const ele=document.getElementById("data");
        const URL = "https://dummyjson.com/products";
        async function loadData(){
            try{
                const res=await fetch(URL);
                const data =await res.json();
                console.log("DATA",data.products);
                let row="";
                data.products.map((i,index)=>{
                 row+=`
                  <tr>
                    <td>${index+1}</td>
                    <td>${i.title}</td>
                    <td><img src="${i.images[0]}" alt="${i.title}"width="100"></td>
                    <td>${i.category}</td>
                    <td>${i.price}</td>

                    </tr>
                  `;
                  ele.innerHTML=row;     
                })
                
                }
            catch(err){
                console.log("ERROR",err);

            }
            
        }
        loadData();
    </script>
</body>
</html>
