<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="demo"></p>
    <h1 id="dem"></h1>
    <script>
        //code (FOR loop)
        for( let i=1;i<5;i++){
            document.write(i);
        }
        const a=["car1","car2","car3","car4","car5"];
        let len=a.length;
        let text="";
        for(let i=1;i<len;i++){
        if(i==1){
            text+=" ";
        }
        else{
            text+=a[i]+"<br>";
        }
        }
        document.getElementById("demo").innerHTML=text;
        //code for while loop
        let i=1;
        while(i<=5){
            document.write(" <br> hello");
            i++;
        }
        document.getElementById("dem").innerHTML=text;
    </script>
</body>
</html>
