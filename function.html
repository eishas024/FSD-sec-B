<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
       function abes(){
        document.write(" <br>hi we are coders");
       }
       abes();
       abes();
       abes();
       function add(a,b){
        var c = a + b;
        document.write("<br>sum of two numbers is " + c);
       }
       add(5, 10);
       add(20, 30);
       add(3, 7);
       const abes = () => "hello";
       document.write("<br>" + abes());
       const add = (a, b) => {
        document.write("<br>sum of two numbers is " + (a + b));
       };
       add(5, 10);
       add(20, 30);
       add(3, 7);
       const car = (name) => {
        document.write("<br>car product ID " + name);
        document.write("<br>car price is " + name);
        document.write("<br>car capacity is " + name);
       };
       car("Toyota Camry");
       
    </script>
</body>
</html>
